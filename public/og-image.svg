<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Costco Tracker</title>
  <desc id="desc">Track Costco receipts, analyze spending, and follow price changes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f7" />
      <stop offset="100%" stop-color="#f5f9ff" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="70" y="70" width="1060" height="490" rx="32" fill="#ffffff" stroke="#dbe3f0" />
  <rect x="120" y="130" width="76" height="76" rx="18" fill="#e31837" />
  <text x="158" y="181" text-anchor="middle" font-size="44" font-family="Arial, sans-serif" font-weight="700" fill="#ffffff">C</text>
  <text x="230" y="178" font-size="64" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">Costco Tracker</text>
  <text x="120" y="260" font-size="34" font-family="Arial, sans-serif" fill="#334155">
    Track receipts, spending trends, gas fill-ups, and price changes in one app.
  </text>
  <g transform="translate(120 322)">
    <rect width="250" height="150" rx="24" fill="#f8fafc" stroke="#dbe3f0" />
    <text x="28" y="48" font-size="26" font-family="Arial, sans-serif" fill="#64748b">Spending</text>
    <text x="28" y="100" font-size="42" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">$4,824</text>
    <text x="28" y="130" font-size="22" font-family="Arial, sans-serif" fill="#16a34a">+12 items tracked</text>
  </g>
  <g transform="translate(395 322)">
    <rect width="250" height="150" rx="24" fill="#f8fafc" stroke="#dbe3f0" />
    <text x="28" y="48" font-size="26" font-family="Arial, sans-serif" fill="#64748b">Gas price</text>
    <text x="28" y="100" font-size="42" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">$3.599</text>
    <text x="28" y="130" font-size="22" font-family="Arial, sans-serif" fill="#2563eb">per gallon</text>
  </g>
  <g transform="translate(670 322)">
    <rect width="360" height="150" rx="24" fill="#f8fafc" stroke="#dbe3f0" />
    <text x="28" y="48" font-size="26" font-family="Arial, sans-serif" fill="#64748b">Price trend</text>
    <polyline points="28,112 96,102 164,110 232,76 300,66" fill="none" stroke="#e31837" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="300" cy="66" r="8" fill="#e31837" />
    <text x="28" y="132" font-size="22" font-family="Arial, sans-serif" fill="#334155">Historical item pricing and purchase history</text>
  </g>
</svg>
